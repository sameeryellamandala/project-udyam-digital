name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Deploy tested commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd /home/ubuntu/project-udyam-digital
          exec 9>/home/ubuntu/.udyam-deploy.lock
          flock -n 9
          test -f .env
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git branch --show-current)" = main
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
            echo 'Skipping superseded deployment; a newer main commit exists.'
            exit 0
          fi
          git merge --ff-only "$DEPLOY_SHA"
          npm ci
          npm run db:migrate
          sudo -n /usr/bin/systemctl restart udyam.service
          for attempt in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              echo 'Deployment health check passed.'
              exit 0
            fi
            sleep 2
          done
          echo 'Deployment health check failed. Inspect the Udyam service on EC2.' >&2
          exit 1
